name: Stats

# Redraws the stats panel (contributions as a sky, streaks, languages) every
# day and publishes it to the output branch, which the README's image points
# at. The output branch holds one commit that is replaced each run, so main
# never fills up with daily stats commits.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/stats.mjs
      - .github/workflows/stats.yml

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json

      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: src

      - name: Draw the panel
        run: node stats.mjs "$RUNNER_TEMP/stats.svg"
        working-directory: src
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish it to the output branch
        run: |
          mkdir "$RUNNER_TEMP/out" && cp "$RUNNER_TEMP/stats.svg" "$RUNNER_TEMP/out/"
          cd "$RUNNER_TEMP/out"
          git init -q -b output
          git config user.name "Md. Nafiz Ahmed"
          git config user.email "nafizahmed000@gmail.com"
          git add stats.svg
          git commit -q -m "Stats for $(date -u +%F)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
