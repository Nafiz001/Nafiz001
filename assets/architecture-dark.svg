<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 432" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">How the projects reach the web</title>
<desc id="d">A push to GitHub runs tests and builds a multi-arch container image for each project in GitHub Actions and publishes it to ghcr.io. Two Oracle Cloud Always Free servers pull new images every ten minutes and serve the back ends behind Caddy. The Next.js and Vite front ends are rebuilt by Vercel on every push and call the back ends over HTTP and WebSockets.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9198a1"/></marker></defs>
<rect x="24" y="40" width="160" height="92" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1.2"/><text x="40" y="66" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="start">GitHub</text><text x="40" y="90" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">12 projects, code public</text><text x="40" y="108" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">tests on every push</text><rect x="224" y="40" width="180" height="92" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1.2"/><text x="240" y="66" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="start">GitHub Actions</text><text x="240" y="90" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">builds each project for</text><text x="240" y="108" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">amd64 and arm64</text><rect x="444" y="40" width="140" height="92" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1.2"/><text x="460" y="66" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="start">ghcr.io</text><text x="460" y="90" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">one multi-arch</text><text x="460" y="108" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">image per project</text>
<line x1="184" y1="86" x2="224" y2="86" stroke="#9198a1" stroke-width="1.4" marker-end="url(#a)"/><line x1="404" y1="86" x2="444" y2="86" stroke="#9198a1" stroke-width="1.4" marker-end="url(#a)"/><line x1="584" y1="86" x2="660" y2="86" stroke="#9198a1" stroke-width="1.4" marker-end="url(#a)"/>
<text x="622" y="106" font-size="11" font-weight="400" fill="#9198a1" text-anchor="middle">servers pull</text><text x="622" y="120" font-size="11" font-weight="400" fill="#9198a1" text-anchor="middle">every 10 min</text>
<line x1="104" y1="132" x2="104" y2="236" stroke="#9198a1" stroke-width="1.4" marker-end="url(#a)"/>
<text x="116" y="190" font-size="11" font-weight="400" fill="#9198a1" text-anchor="start">a push also deploys the front ends</text>
<rect x="24" y="236" width="560" height="144" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1.2"/><text x="44" y="264" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="start">Vercel</text><text x="44" y="286" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">Next.js and Vite front ends, rebuilt on every push</text><rect x="44" y="316" width="98" height="30" rx="8" fill="#0c2d6b" stroke="#4493f8" stroke-width="1.2"/><text x="93" y="336" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="middle">Vernissage</text><rect x="152" y="316" width="91" height="30" rx="8" fill="#0c2d6b" stroke="#4493f8" stroke-width="1.2"/><text x="197.5" y="336" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="middle">noctiluca</text><rect x="253" y="316" width="76" height="30" rx="8" fill="#0c2d6b" stroke="#4493f8" stroke-width="1.2"/><text x="291" y="336" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="middle">Vantage</text><rect x="339" y="316" width="120" height="30" rx="8" fill="#0c2d6b" stroke="#4493f8" stroke-width="1.2"/><text x="399" y="336" font-size="13" font-weight="400" fill="#e6edf3" text-anchor="middle">Ryōiki Tenkai</text>
<line x1="584" y1="316" x2="660" y2="316" stroke="#9198a1" stroke-width="1.4" marker-end="url(#a)"/>
<text x="622" y="336" font-size="11" font-weight="400" fill="#9198a1" text-anchor="middle">API and</text><text x="622" y="350" font-size="11" font-weight="400" fill="#9198a1" text-anchor="middle">WebSocket</text><text x="622" y="364" font-size="11" font-weight="400" fill="#9198a1" text-anchor="middle">calls</text>
<rect x="660" y="24" width="276" height="384" rx="8" fill="#1f1a0d" stroke="#9e6a03" stroke-width="1.2"/><text x="676" y="50" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="start">Oracle Cloud, Always Free</text><text x="676" y="68" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">Docker, with Caddy for HTTPS</text><rect x="676" y="84" width="244" height="148" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1.2"/><text x="692" y="108" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="start">Ampere A1, 2 CPU, 12 GB</text><text x="692" y="132" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">Vernissage API + PostgreSQL</text><text x="692" y="152" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">Logarithm Warehouse, 10 containers</text><text x="692" y="172" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">noctiluca, Django + Channels</text><text x="692" y="192" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">kori + PostgreSQL + Redis</text><text x="692" y="212" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">quill, SQL database</text><rect x="676" y="248" width="244" height="148" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1.2"/><text x="692" y="272" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="start">AMD micro, 1 GB</text><text x="692" y="296" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">ebru, Rust + WebAssembly</text><text x="692" y="316" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">kirie, ASP.NET Core</text><text x="692" y="336" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">lumen, search engine</text><text x="692" y="356" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">gedis, Redis-compatible</text><text x="692" y="376" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">asterism, Expo web</text>
</svg>
